apiVersion: apps/v1
kind: Deployment
metadata:
  name: blogy-backend
  namespace: blogy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blogy-backend
  template:
    metadata:
      labels:
        app: blogy-backend
    spec:
      containers:
      - name: blogy-backend
        image: murtaza007/blogy-backend:latest  # ← YE CHANGE HOGA
        ports:
        - containerPort: 3001
        envFrom:
        - secretRef:
            name: blogy-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: blogy-backend
spec:
  type: LoadBalancer
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: blogy-backend