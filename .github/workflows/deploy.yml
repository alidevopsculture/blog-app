name: Blogy CI/CD Pipeline
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    # 1. Code checkout
    - uses: actions/checkout@v4

    # 2. Docker login
    - name: Docker login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    # 3. Build & Push Frontend
    - name: Build Frontend
      run: |
        cd blogy-frontend
        docker build -t ${{ secrets.DOCKERHUB_USERNAME}}/blogy-frontend-image:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME}}/blogy-frontend-image:latest

    # 4. Build & Push Backend.  
    - name: Build Backend
      run: |
        cd blogy-backend
        docker build -t ${{ secrets.DOCKERHUB_USERNAME}}/blogy-backend-image:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME}}/blogy-backend-image:latest

    # 5. Deploy to EC2 Kubernetes.
    - name: Deploy to Kubernetes
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_PUBLIC_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: | # Image update only (No git pull!)
          kubectl set image deployment/blogy-frontend blogy-frontend=${{ secrets.DOCKERHUB_USERNAME}}/blogy-frontend-image:${{ github.sha }} -n blogy
          kubectl set image deployment/blogy-backend blogy-backend=${{ secrets.DOCKERHUB_USERNAME}}/blogy-backend-image:${{ github.sha }} -n blogy
          kubectl rollout status deployment/blogy-frontend --timeout=300s -n blogy
          kubectl rollout status deployment/blogy-backend --timeout=300s -n blogy
          kubectl get svc -n blogy
          echo "🚀 Deployment LIVE!"

    - name: Verify deployment
      run: |
        kubectl get pods -n blogy
        kubectl get svc -n blogy