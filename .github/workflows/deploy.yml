#BLOCK 1: WORKFLOW METADATA
name: Deploy-blog
# BLOCK 2: TRIGGERS (When to Run)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

#BLOCK 3: JOBS (What Work to Do)
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # BLOCK 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # BLOCK 2: DockerHub login
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # BLOCK 3: Backend Build + Push
      - name: Build Backend
        run: |
          cd blogy-backend
          npm ci
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/blogy-backend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/blogy-backend:latest

      # BLOCK 4: Frontend Build + Push  
      - name: Build Frontend
        run: |
          cd blogy-frontend
          npm ci
          npm run build
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/blogy-frontend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/blogy-frontend:latest

      # BLOCK 5: Deploy to EC2 Kubernetes
      - name: Deploy to EC2 K8S
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            kubectl set image deployment/blogy-frontend blogy-frontend=${{ secrets.DOCKERHUB_USERNAME }}/blogy-frontend:latest -n blogy || true
            kubectl set image deployment/blogy-backend blogy-backend=${{ secrets.DOCKERHUB_USERNAME }}/blogy-backend:latest -n blogy || true
            kubectl rollout status deployment/blogy-frontend -n blogy || true
            kubectl rollout status deployment/blogy-backend -n blogy || true
            echo "Deployment successful"